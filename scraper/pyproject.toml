[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spookcue-scraper"
version = "0.1.0"
description = "Jump-scare scraper, TMDB metadata fetcher, and phonetic dialogue indexing pipeline for SpookCue"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SpookCue Team" }
]
dependencies = [
    "httpx[http2]>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "srt>=3.5.3",
    "Metaphone>=0.6",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
spookcue-scraper = "spookcue_scraper.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
